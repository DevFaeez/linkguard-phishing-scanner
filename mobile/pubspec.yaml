name: linkguard
description: "LinkGuard research prototype: Flutter URL scans and opt-in Android notification monitoring."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  punycoder: 0.3.0
  crypto: 3.0.6
  camera: 0.12.2
  zxing2: 0.2.4
  image: 4.13.1
  image_picker: 1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model.json
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/DMSerifDisplay-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay.ttf
